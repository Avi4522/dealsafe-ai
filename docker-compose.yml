version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - python-service
    restart: unless-stopped

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped